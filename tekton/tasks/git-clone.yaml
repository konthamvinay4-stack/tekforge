apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: git-clone
  namespace: tekforge
spec:
  description: "Clone the requested repository revision into the shared workspace."
  params:
    - name: url
      type: string
    - name: revision
      type: string
      default: main
  workspaces:
    - name: output
  steps:
    - name: clone
      image: alpine/git:2.52.0
      workingDir: $(workspaces.output.path)
      script: |
        #!/bin/sh
        set -eu
        rm -rf ./* ./.??* 2>/dev/null || true
        git clone --depth 1 --branch "$(params.revision)" "$(params.url)" .

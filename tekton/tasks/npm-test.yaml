apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: npm-test
  namespace: tekforge
spec:
  description: "Install dependencies and run the application's test suite."
  workspaces:
    - name: source
  steps:
    - name: test
      image: node:22-alpine
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        npm ci
        npm test --if-present

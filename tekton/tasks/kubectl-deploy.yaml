apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: kubectl-deploy
  namespace: tekforge
spec:
  description: "Apply the application's Kubernetes manifest and update its container image."
  params:
    - name: image
      type: string
    - name: deployment-name
      type: string
      default: tekforge-app
    - name: container-name
      type: string
      default: app
    - name: namespace
      type: string
      default: tekforge
  workspaces:
    - name: source
  steps:
    - name: deploy
      image: bitnami/kubectl:1.34
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        if [ ! -f k8s/deployment.yaml ]; then
          echo "No k8s/deployment.yaml found."
          exit 1
        fi

        kubectl apply -n "$(params.namespace)" -f k8s/deployment.yaml
        kubectl -n "$(params.namespace)" set image \
          "deployment/$(params.deployment-name)" \
          "$(params.container-name)=$(params.image)"
        kubectl -n "$(params.namespace)" rollout status \
          "deployment/$(params.deployment-name)" --timeout=180s

apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: node-ci
  namespace: tekforge
spec:
  description: "TekForge runtime-aware pipeline: checkout, test, security, image build, deploy."
  params:
    - name: repo-url
      type: string
    - name: revision
      type: string
      default: main
    - name: image
      type: string
    - name: runtime-image
      type: string
      default: node:22-alpine
    - name: test-command
      type: string
      default: "npm test"
  tasks:
    - name: checkout
      taskRef:
        name: git-clone
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)
      workspaces:
        - name: output
          workspace: source
    - name: test
      runAfter: [checkout]
      taskRef:
        name: runtime-test
      params:
        - name: runtime-image
          value: $(params.runtime-image)
        - name: test-command
          value: $(params.test-command)
      workspaces:
        - name: source
          workspace: source
    - name: security
      runAfter: [checkout]
      taskRef:
        name: trivy-scanner
      workspaces:
        - name: source
          workspace: source
    - name: build-image
      runAfter: [test, security]
      taskRef:
        name: kaniko-build
      params:
        - name: IMAGE
          value: $(params.image)
      workspaces:
        - name: source
          workspace: source
    - name: deploy
      runAfter: [build-image]
      taskRef:
        name: kubectl-deploy
      params:
        - name: image
          value: $(params.image)
      workspaces:
        - name: source
          workspace: source
  workspaces:
    - name: source
      description: "Shared source workspace used by build and scan tasks."

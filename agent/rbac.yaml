apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekforge-agent
  namespace: tekforge-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tekforge-agent-read
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "pods", "services", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["tekton.dev"]
    resources: ["pipelines", "pipelineruns", "tasks", "taskruns"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tekforge-agent-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekforge-agent-read
subjects:
  - kind: ServiceAccount
    name: tekforge-agent
    namespace: tekforge-system
---
apiVersion: v1
kind: Namespace
metadata:
  name: tekforge
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tekforge-agent-executor
  namespace: tekforge
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["get", "create", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tekforge-agent-executor
  namespace: tekforge
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tekforge-agent-executor
subjects:
  - kind: ServiceAccount
    name: tekforge-agent
    namespace: tekforge-system

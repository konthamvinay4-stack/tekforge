apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: kaniko-build
  namespace: tekforge
spec:
  description: "Build a container image from the application source. GKE Workload Identity provides registry credentials."
  params:
    - name: IMAGE
      type: string
  workspaces:
    - name: source
  steps:
    - name: build
      image: gcr.io/kaniko-project/executor:v1.24.0
      args:
        - --context=$(workspaces.source.path)
        - --dockerfile=$(workspaces.source.path)/Dockerfile
        - --destination=$(params.IMAGE)

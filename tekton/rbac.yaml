apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekforge-build
  namespace: tekforge
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekforge-controlplane
  namespace: tekforge
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tekforge-deployer
  namespace: tekforge
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["services", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tekforge-deployer
  namespace: tekforge
subjects:
  - kind: ServiceAccount
    name: tekforge-build
    namespace: tekforge
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tekforge-deployer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tekforge-controlplane
  namespace: tekforge
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: ["tekton.dev"]
    resources: ["taskruns"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tekforge-controlplane
  namespace: tekforge
subjects:
  - kind: ServiceAccount
    name: tekforge-controlplane
    namespace: tekforge
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tekforge-controlplane
